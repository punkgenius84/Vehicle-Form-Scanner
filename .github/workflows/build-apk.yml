name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Prepare Big Jay's branded Android launcher icons
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          source = Image.open("www/assets/branding/big_jays_logo_300x300.png").convert("RGBA")
          background = (7, 27, 59, 255)
          for density, size in [("mdpi", 48), ("hdpi", 72), ("xhdpi", 96), ("xxhdpi", 144), ("xxxhdpi", 192)]:
              folder = Path(f"android/app/src/main/res/mipmap-{density}")
              folder.mkdir(parents=True, exist_ok=True)
              canvas = Image.new("RGBA", (size, size), background)
              logo = ImageOps.contain(source, (int(size * .82), int(size * .82)), Image.Resampling.LANCZOS)
              canvas.alpha_composite(logo, ((size-logo.width)//2, (size-logo.height)//2))
              canvas.save(folder / "ic_launcher.png")
              canvas.save(folder / "ic_launcher_round.png")
              canvas.save(folder / "ic_launcher_foreground.png")
          # Adaptive icon foreground: keep the artwork inside Android's safe zone.
          canvas = Image.new("RGBA", (432, 432), (0, 0, 0, 0))
          logo = ImageOps.contain(source, (264, 264), Image.Resampling.LANCZOS)
          canvas.alpha_composite(logo, ((432-logo.width)//2, (432-logo.height)//2))
          drawable = Path("android/app/src/main/res/drawable-nodpi")
          drawable.mkdir(parents=True, exist_ok=True)
          canvas.save(drawable / "launcher_logo.png")
          PY
          cat > android/app/src/main/res/drawable/ic_launcher_foreground.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <bitmap xmlns:android="http://schemas.android.com/apk/res/android"
              android:src="@drawable/launcher_logo"
              android:gravity="center"
              android:filter="true" />
          XML
          # Android API 24+ prefers the version-qualified drawable, which otherwise
          # keeps Capacitor's default robot graphic and overrides the branded icon.
          mkdir -p android/app/src/main/res/drawable-v24
          cp android/app/src/main/res/drawable/ic_launcher_foreground.xml \
             android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml

      - name: Build debug APK
        run: |
          cd android
          bash ./gradlew assembleDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VinScanner-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
