apply plugin: 'com.android.application'
android {
 namespace "com.vehicleform.scanner"
 compileSdk 35
 defaultConfig { applicationId "com.vehicleform.scanner"; minSdk 23; targetSdk 35; versionCode 1; versionName "1.0"; testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner" }
}
dependencies {
 implementation "androidx.appcompat:appcompat:1.7.0"
 implementation "androidx.core:core:1.15.0"
 implementation "androidx.camera:camera-camera2:1.5.3"
 implementation "androidx.camera:camera-lifecycle:1.5.3"
 implementation "androidx.camera:camera-view:1.5.3"
 implementation "com.google.mlkit:barcode-scanning:17.3.0"
 implementation "com.google.mlkit:text-recognition:16.0.1"
 implementation "com.google.guava:guava:33.3.1-android"
 implementation project(':capacitor-android')
}